architecture: amd64

actions:
  # Test: overlay from recipe directory using default origin
  - action: overlay
    description: Overlay testfiles from recipe directory (default origin)
    source: testfiles
    destination: /default-origin

  - action: run
    chroot: false
    description: Verify overlaid file content matches source (default origin)
    command: diff ${RECIPEDIR}/testfiles/hello.txt ${ROOTDIR}/default-origin/hello.txt

  # Test: overlay from recipe directory using explicit 'recipe' origin
  - action: overlay
    description: Overlay testfiles with explicit 'recipe' origin
    origin: recipe
    source: testfiles
    destination: /recipe-origin

  - action: run
    chroot: false
    description: Verify overlaid file content matches source (explicit 'recipe' origin)
    command: diff ${RECIPEDIR}/testfiles/hello.txt ${ROOTDIR}/recipe-origin/hello.txt
