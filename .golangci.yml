version: "2"
linters:
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - nilnesserr
    - nolintlint
    - predeclared
    - reassign
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
    - wrapcheck
  exclusions:
    presets:
      - comments
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  # Do not limit the number of reported issues.
  max-issues-per-linter: 0
  max-same-issues: 0
