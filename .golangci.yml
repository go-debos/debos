version: "2"
linters:
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - nilnesserr
    - nonamedreturns
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
  settings:
    exhaustive:
      # A switch that handles the cases it cares about and defers the rest to
      # default is exhaustive. Without this, any switch over a large stdlib
      # enum such as reflect.Kind has to list every member.
      default-signifies-exhaustive: true
    recvcheck:
      exclusions:
        # Command.Run only reads its receiver, and the zero value is meaningful:
        # Command{}.Run(...) means "run on the host, no chroot". A composite
        # literal is not addressable, so a pointer receiver would break that
        # idiom for callers, here and downstream.
        - "Command.Run"
  exclusions:
    presets:
      - comments
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  # Do not limit the number of reported issues.
  max-issues-per-linter: 0
  max-same-issues: 0
