version: "2"
linters:
  enable:
    - govet
    - errorlint
    - misspell
    - revive
    - staticcheck
    - whitespace
  exclusions:
    presets:
      - comments
      - std-error-handling
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  # Do not limit the number of reported issues.
  max-issues-per-linter: 0
  max-same-issues: 0
